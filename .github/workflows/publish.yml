name: Build and publish

# build-check runs on every pull request and push to main, so packaging
# problems show up before a release. The publish jobs reuse the files that
# build-check built and checked, through the "dist" artifact:
#   - publish-testpypi: run this workflow by hand (Actions > Build and publish >
#     Run workflow) to try a release on TestPyPI.
#   - publish-pypi: push a tag such as v0.2.0 to release on PyPI.
# Both publish with PyPI Trusted Publishing, so no API token is stored here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openeo-udp
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      # Builds the sdist, then the wheel from the sdist, so a file missing
      # from the sdist also breaks the wheel and fails the checks below
      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata and README rendering
        run: uvx twine check --strict dist/*

      - name: Check wheel contents
        run: |
          python - <<'EOF'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          version = wheel.split("-")[1]
          names = zipfile.ZipFile(wheel).namelist()
          dist_info = f"openeo_portable-{version}.dist-info"

          top_level = {name.split("/")[0] for name in names}
          unexpected = top_level - {"openeo_portable", dist_info}
          assert not unexpected, f"Unexpected top-level entries: {unexpected}"

          for license_file in ("LICENSE", "LICENSING.md"):
              path = f"{dist_info}/licenses/{license_file}"
              assert path in names, f"Missing {path}"

          print(f"{wheel}: {len(names)} files, contents OK")
          EOF

      # Runs outside the checkout, so Python imports the installed wheel and
      # not the openeo_portable/ folder in the repository
      - name: Install wheel in a clean environment
        working-directory: ${{ runner.temp }}
        run: |
          uv venv smoke
          uv pip install --python smoke/bin/python "$GITHUB_WORKSPACE"/dist/*.whl

      - name: Smoke test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          WHEEL=$(ls "$GITHUB_WORKSPACE"/dist/*.whl)
          export WHEEL_VERSION=$(basename "$WHEEL" | cut -d- -f2)
          smoke/bin/python - <<'EOF'
          import os

          import openeo_portable
          from openeo_portable import ParameterManager, list_parameter_files

          assert "site-packages" in openeo_portable.__file__, openeo_portable.__file__

          expected = os.environ["WHEEL_VERSION"]
          assert openeo_portable.__version__ == expected, (
              f"__version__ is {openeo_portable.__version__}, wheel is {expected}"
          )

          files = list_parameter_files()
          assert len(files) == 36, f"Expected 36 parameter files, found {len(files)}"

          manager = ParameterManager("urban_areas.params.py")
          source = manager.describe_source()
          assert source.endswith("(packaged with openeo-portable)"), source

          print(f"openeo-portable {expected}: {len(files)} parameter files, {source}")
          EOF

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/openeo-portable/
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build-check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openeo-portable/
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A PyPI version cannot be replaced once uploaded, so stop if the tag
      # and the package version disagree
      - name: Check tag matches package version
        run: |
          WHEEL_VERSION=$(ls dist/*.whl | xargs basename | cut -d- -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$WHEEL_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $WHEEL_VERSION"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
